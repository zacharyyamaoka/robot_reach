# robot-sdk declaration: the shared types this package's public API takes (consumes) and gives (produces),
# each with the symbols that are the contract. Checked against the code by robot_sdk's
# `python -m tools.sdk_graph check` (docs/graph-schema.md in github.com/zacharyyamaoka/robot_sdk).
schema = "robot-sdk-declaration/1"
role = "library"
layer = "leaf"
one_line = "Workspace and IK-branch reach of any arm, FK/IK passed in"
summary = "Reachability of any arm in Cartesian and joint space, from FK and IK passed in as pure functions. Reach maps, joint maps, IK branches, orientations; save results, view them in viser, and hand them downstream as a `ReachableWorkspace` (`robot_reach.workspace`, from `ReachResult.workspace()`) whose named regions (reachable, top-down, hemisphere, dexterous, your own) sample IK-checked poses. Ready and rest poses: `robot_reach.rest` measures a pose's footprint, clearance and holding power over a scene, and `robot_reach.goals.solve` picks the best one for a use case (a `PoseGoal`: clearances, held or limp, readiness to a workspace, energy), whose record `to_named_pose` turns into a robot_msgs NamedPose. Example arms built in (pendulum, RR, five-bar, 3-DOF shoulder, UR5e); loads URDFs."
use_when = "Workspace, \"can the arm reach X\", IK branch choice, sampling reachable poses for a task, placing a robot or a bin, arm sizing, choosing a ready or rest pose (and its NamedPose)."

# Where to read more. github and pypi are required; the rest are what this package has.
[links]
github = "https://github.com/zacharyyamaoka/robot_reach"
pypi = "https://pypi.org/project/robot-reach/"

[[produces]]
type = "robot_msgs.manipulation.NamedPose"
symbols = [
  "robot_reach.goals.to_named_pose",
]

# PoseSamples.poses() / .joint_states() hand out robot_msgs Pose / JointState but are annotated `-> list`, so the
# scanner cannot see the type; they are not declared (the lint fails on a declaration it can't verify).
