# robot-sdk declaration: the shared types this package's public API takes (consumes) and gives (produces),
# each with the symbols that are the contract. Checked against the code by robot_sdk's
# `python -m tools.sdk_graph check` (docs/graph-schema.md in github.com/zacharyyamaoka/robot_sdk).
schema = "robot-sdk-declaration/1"
role = "library"
layer = "leaf"
one_line = "Workspace and IK-branch reach of any arm, FK/IK passed in"
summary = "Reachability of any arm in Cartesian and joint space, from FK and IK passed in as pure functions. Reach maps, joint maps, IK branches, orientations; save results, view them in viser. Example arms built in: pendulum, RR, five-bar, 3-DOF shoulder, UR5e. Loads URDFs."
use_when = "Workspace, \"can the arm reach X\", IK branch choice, placing a robot or a bin, arm sizing."

# Where to read more. github and pypi are required; the rest are what this package has.
[links]
github = "https://github.com/zacharyyamaoka/robot_reach"
pypi = "https://pypi.org/project/robot-reach/"

[[produces]]
type = "robot_msgs.manipulation.NamedPose"
symbols = [
  "robot_reach.goals.to_named_pose",
]
